<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Voluntários</title>
    <link rel="stylesheet" th:href="@{/css/styleUsers.css}">
</head>
<body>
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div> 

    <h1>Lista de Voluntários</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID User</th>
                <th>Nome</th>
                <th>Data de Nascimento</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Função</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="voluntario : ${voluntarios}">
                <td th:text="${voluntario.idUser}"></td>
                <td th:text="${voluntario.nome}"></td>
                <td th:text="${voluntario.dataNasc}"></td>
                <td th:text="${voluntario.email}"></td>
                <td th:text="${voluntario.telefone}"></td>
                <td th:text="${voluntario.funcao}"></td>
                <td>
                    <a th:href="@{/voluntarios/{id}(id=${voluntario.idUser})}">Ver</a> |
                    <a th:href="@{/voluntarios/edit/{id}(id=${voluntario.idUser})}">Editar</a> |
                    
                    <form th:action="@{/voluntarios/delete/{id}(id=${voluntario.idUser})}" method="post" style="display: inline;">
                        <button type="submit" 
                                onclick="return confirm('Tem certeza que deseja excluir este voluntário?')"
                                class="link-excluir"
                                style="border: none; background: none; padding: 0; cursor: pointer; font-family: inherit; font-size: inherit">
                            Excluir
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <p><a th:href="@{/voluntarios/new}">Cadastrar Novo Voluntário</a></p>
    <p><a th:href="@{/}">Voltar para Home</a></p>
</body>
</html>
