<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Administradores</title>
    <link rel="stylesheet" th:href="@{/css/styleUsers.css}">
</head>
<body>
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div> 
    <h1>Lista de Administradores</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID User</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Função</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="admin : ${administradores}">
                <td th:text="${admin.idUser}"></td>
                <td th:text="${admin.nome}"></td>
                <td th:text="${admin.email}"></td>
                <td th:text="${admin.telefone}"></td>
                <td th:text="${admin.funcao}"></td>
                <td>
                    <a th:href="@{/administradores/{id}(id=${admin.idUser})}">Ver</a> |
                    <a th:href="@{/administradores/edit/{id}(id=${admin.idUser})}">Editar</a> |
                    <form th:action="@{/administradores/delete/{id}(id=${admin.idUser})}" method="post" style="display: inline;">
                        <button type="submit" onclick="return confirm('Tem certeza?')" class="link-excluir" style="border: none; background: none; padding: 0; text-decoration: underline; cursor: pointer; font-family: inherit; font-size: inherit;">
                            Excluir
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <p><a th:href="@{/administradores/new}">Cadastrar Novo Administrador</a></p>
    <p><a th:href="@{/}">Voltar para Home</a></p>
</body>
</html>
