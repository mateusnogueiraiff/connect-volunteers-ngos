<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Representantes</title>
</head>
<body>
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}" style="color: green;"></span>
    </div>

    <!-- 
    -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div> 

    <h1>Lista de Representantes</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID User</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Função</th>
                <th>ONG</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="representante : ${representantes}">
                <td th:text="${representante.idUser}"></td>
                <td th:text="${representante.nome}"></td>
                <td th:text="${representante.email}"></td>
                <td th:text="${representante.telefone}"></td>
                <td th:text="${representante.funcao}"></td>
                <td th:text="${representante.ong.nome}"></td>
            </tr>
        </tbody>
    </table>

    <p><a th:href="@{/representantes/new}">Cadastrar New Representante</a></p>
    <p><a th:href="@{/}">Voltar para Home</a></p>
</body>
</html>
