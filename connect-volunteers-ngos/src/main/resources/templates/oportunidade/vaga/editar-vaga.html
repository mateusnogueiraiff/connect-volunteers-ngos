<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Vaga</title>
    <link rel="stylesheet" th:href="@{/css/styleCadastroVagas.css}">
</head>
<body>
    <h1>Editar Vaga</h1>

    <div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>

    <form th:action="@{/vagas/update/{id}(id=${vaga.id})}" th:object="${vaga}" method="post">
        <input type="hidden" th:field="*{id}" />
        
        <p>
            <label>Nome: </label>
            <input type="text" th:field="*{nome}" required>
        </p>
        <p>
            <label>Descrição: </label>
            <textarea th:field="*{descricao}" required></textarea>
        </p>
        <p>
            <label>Requisitos: </label>
            <input type="text" th:field="*{requisitos}">
        </p>
        <p>
            <label>Local: </label>
            <input type="text" th:field="*{local}">
        </p>
        <p>
            <label>Data/Horário: </label>
            <input type="text" th:field="*{dataHorario}">
        </p>
        <p>
            <label>Quantidade de Vagas: </label>
            <input type="number" th:field="*{quantidadeDeVagas}">
        </p>
        <p>
            <label>ONG: </label>
            <select th:field="*{ong.id}" required>
                <option value="" disabled>Selecione uma ONG</option>
                <option th:each="ong : ${ongs}" th:value="${ong.id}" th:text="${ong.nome}"></option>
            </select>
        </p>

        <p>
            <button type="submit">Salvar Alterações</button>
        </p>
    </form>
</body>
</html>
