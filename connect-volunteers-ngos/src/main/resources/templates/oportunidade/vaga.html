<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Vaga</title>
</head>
<body>
    <h1 th:text="${vaga.nome}">Nome da Vaga</h1>
    <p><strong>ONG:</strong> <span th:text="${vaga.ong.nome}">Nome da ONG</span></p>
    <p><strong>Descrição:</strong> <span th:text="${vaga.descricao}">Descrição aqui</span></p>
    <p><strong>Requisitos:</strong> <span th:text="${vaga.requisitos}">Requisitos aqui</span></p>
    <p><strong>Local:</strong> <span th:text="${vaga.local}">Local aqui</span></p>
    <p><strong>Data/Horário:</strong> <span th:text="${vaga.dataHorario}">Data aqui</span></p>
    <p><strong>Quantidade de Vagas:</strong> <span th:text="${vaga.quantidadeDeVagas}">0</span></p>

    <br>

    <!-- Botão de inscrição (futuro fluxo do voluntário) -->
    <form th:action="@{'/vagas/' + ${vaga.id} + '/inscricao'}" method="post">
        <button type="submit">Quero me inscrever</button>
    </form>

    <br>
    <a th:href="@{/vagas}">Voltar para lista de vagas</a>
</body>
</html>
