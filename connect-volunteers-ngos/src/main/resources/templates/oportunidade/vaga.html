<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Vaga</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${vaga.nome}"></h1>
        <h3>ONG: <span th:text="${vaga.ong.nome}"></span></h3>
        <p><strong>Descrição:</strong> <span th:text="${vaga.descricao}"></span></p>
        <p><strong>Requisitos:</strong> <span th:text="${vaga.requisitos}"></span></p>
        <p><strong>Local:</strong> <span th:text="${vaga.local}"></span></p>
        <p><strong>Data/Horário:</strong> <span th:text="${vaga.dataHorario}"></span></p>
        <p><strong>Quantidade de Vagas:</strong> <span th:text="${vaga.quantidadeDeVagas}"></span></p>

        <hr>

        <!-- Botão para voluntário se inscrever -->
        <div th:if="${T(br.edu.iff.ccc.connectvolunteersngos.connect_volunteers_ngos.entities.user.Voluntario).isInstance(usuarioLogado)}">
            <form th:action="@{'/inscricoes/vaga/' + ${vaga.id}}" method="post">
                <button type="submit">Inscrever-se</button>
            </form>
        </div>

        <!-- Botão para representante visualizar inscrições -->
        <div th:if="${T(br.edu.iff.ccc.connectvolunteersngos.connect_volunteers_ngos.entities.user.Representante).isInstance(usuarioLogado)}">
            <a th:href="@{'/inscricoes/vaga/' + ${vaga.id}}">Ver inscrições</a>
        </div>

        <br>
        <a th:href="@{/vagas}">Voltar para lista de vagas</a>
    </div>
</body>
</html>
