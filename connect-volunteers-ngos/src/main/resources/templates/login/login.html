<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{base/baseLayout :: baseHead}"></th:block>
    <!--Colocar link para o css dessa pag-->
    <style>
        .alert { padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .form-container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 6px; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 15px; width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header th:replace="~{base/baseLayout :: baseHeaderPage}"></header>

    <main>
        <h1 th:text="#{plataform.name}">Plataform Name</h1>

        <h2>Login</h2>
        
        <!--logout bem sucedido-->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!--erro ao efetuar o login-->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form action="/login" method="post">
            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </p>
            <p>
                <button type="submit">Entrar</button>
            </p>
        </form>

        <!--
            precisa mudar essa rota de cadastro, essa abaixo é antes da implementação do cadastro separado para volunt e represent
            <p>Não tem uma conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
        -->
    </main>

    <footer th:replace="~{base/baseLayout :: baseFooterPage}"></footer>
</body>
</html>
