<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{base/baseLayout :: baseHead}"></th:block>
    <!--Colocar link para o css dessa pag-->
</head>
<body>
    <header th:replace="~{base/baseLayout :: baseHeaderPage}"></header>

    <main>
        <h1 th:text="#{plataform.name}">Plataform Name</h1>

        <h2>Cadastro de Usuário</h2>
        <form th:action="@{/cadastro}" method="post">
            <label for="nome">Nome completo:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required><br><br>
            <label for="tipoUsuario">Tipo de Usuário:</label><br>
            <select id="tipoUsuario" name="tipoUsuario" required>
                <option value="" disabled selected>Selecione</option>
                <option value="voluntario">Voluntário</option>
                <option value="representante">Representante</option>
            </select><br><br>
            <button type="submit">Cadastrar</button>
        </form>

        <p><a th:href="@{/login}">Já tenho uma conta</a></p>
    </main>

    <footer th:replace="~{base/baseLayout :: baseFooterPage}"></footer>
</body>
</html>
